# --- SERVER T?NZ?ML?M?L?R? ---
server.port=8082
spring.application.name=event-service

# --- POSTGRESQL (EVENT_DB) BA?LANTISI ---
# Docker mühitind? 'db' (v? ya postgres) servis ad?na müraci?t edirik
# ?g?r bazan? Mac-in özünd? saxlay?rs?n?zsa: host.docker.internal:5432/event_db
spring.datasource.url=jdbc:postgresql://db:5432/event_db
spring.datasource.username=postgres
spring.datasource.password=2016
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA & HIBERNATE ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 'update' istifad? edirik ki, kopyalad???n?z real datalar silinm?sin
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- EUREKA NAMING SERVER (Qeydiyyat) ---
# Docker-d? Eureka-n? 'eureka-server' ad? il? qald?rd???n?z? f?rz edir?m
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# --- REDIS (CACHE) ---
spring.data.redis.host=redis-server
spring.data.redis.port=6379

# --- KAFKA (MESSAGING) ---
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=event-group

# --- LOGGING & MONITORING ---
logging.level.org.springframework.web=INFO
logging.level.com.ticketmaster=DEBUG