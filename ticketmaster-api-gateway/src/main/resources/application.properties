spring.application.name=ticketmaster-api-gateway
server.port=8080

# Config Server-i ba?lay?r?q
spring.cloud.config.enabled=false

# Docker daxili ünvanlar
spring.data.redis.host=ticketmaster-redis
spring.data.redis.port=6379
eureka.client.service-url.defaultZone=http://ticketmaster-eureka:8761/eureka/

# JWT
jwt.secret=zdtlYp76Nl89pXmR2S7G6kL9QpWz3B1m5N8XqW2V0rY7T4m9K6qW2V0rY7T4m9K6zdtlYp76Nl89pXmR2S7G6kL9QpWz3B1
jwt.expiration=3600000

# ==========================================
# ROUTES (BÜTÜN ADLAR BÖYÜK H?RFL? V? F?LTERL?)
# ==========================================

# 1. USER SERVICE
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://TICKETMASTER-USER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**, /api/v1/users/**
spring.cloud.gateway.routes[0].filters[0]=AuthenticationFilter

# 2. TICKET SERVICE
spring.cloud.gateway.routes[1].id=ticket-service
spring.cloud.gateway.routes[1].uri=lb://TICKETMASTER-TICKET-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/tickets/**
spring.cloud.gateway.routes[1].filters[0]=AuthenticationFilter

# 3. EVENT SERVICE
spring.cloud.gateway.routes[2].id=event-service
spring.cloud.gateway.routes[2].uri=lb://TICKETMASTER-EVENT-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/events/**
spring.cloud.gateway.routes[2].filters[0]=AuthenticationFilter

# 4. ORDER SERVICE
spring.cloud.gateway.routes[3].id=order-service
spring.cloud.gateway.routes[3].uri=lb://TICKETMASTER-ORDER-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/orders/**
spring.cloud.gateway.routes[3].filters[0]=AuthenticationFilter

# 5. VENUE SERVICE (Event Service-? gedir)
spring.cloud.gateway.routes[4].id=venue-service
spring.cloud.gateway.routes[4].uri=lb://TICKETMASTER-EVENT-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/venues/**
spring.cloud.gateway.routes[4].filters[0]=AuthenticationFilter

# 6. RESERVATION SERVICE
spring.cloud.gateway.routes[5].id=reservation-service
spring.cloud.gateway.routes[5].uri=lb://TICKETMASTER-TICKET-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/reservations/**
spring.cloud.gateway.routes[5].filters[0]=AuthenticationFilter

# 7. CATEGORY SERVICE (Event Service-? gedir)
spring.cloud.gateway.routes[6].id=category-service
spring.cloud.gateway.routes[6].uri=lb://TICKETMASTER-EVENT-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/v1/categories/**
spring.cloud.gateway.routes[6].filters[0]=AuthenticationFilter

# 8. PAYMENT SERVICE
spring.cloud.gateway.routes[7].id=payment-service
spring.cloud.gateway.routes[7].uri=lb://TICKETMASTER-PAYMENT-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/v1/payments/**
spring.cloud.gateway.routes[7].filters[0]=AuthenticationFilter

# 9. NOTIFICATION SERVICE
spring.cloud.gateway.routes[8].id=notification-service
spring.cloud.gateway.routes[8].uri=lb://TICKETMASTER-NOTIFICATION-SERVICE
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/v1/notifications/**
spring.cloud.gateway.routes[8].filters[0]=AuthenticationFilter

# Eureka-ya ID ?v?zin? IP il? qeydiyyatdan keçm?sini deyirik
eureka.instance.prefer-ip-address=true
# ==========================================
# SWAGGER / OPENAPI CONFIGURATION
# ==========================================

# Gateway-in öz Swagger s?hif?sini aktiv edirik
springdoc.swagger-ui.enabled=true

# Dig?r servisl?rin s?n?dl?rini (docs) Gateway-? ba?lay?r?q
springdoc.swagger-ui.urls[0].name=User Service
springdoc.swagger-ui.urls[0].url=/api/v1/users/v3/api-docs

springdoc.swagger-ui.urls[1].name=Ticket Service
springdoc.swagger-ui.urls[1].url=/api/v1/tickets/v3/api-docs

springdoc.swagger-ui.urls[2].name=Event Service
springdoc.swagger-ui.urls[2].url=/api/v1/events/v3/api-docs

springdoc.swagger-ui.urls[3].name=Order Service
springdoc.swagger-ui.urls[3].url=/api/v1/orders/v3/api-docs

springdoc.swagger-ui.urls[4].name=Payment Service
springdoc.swagger-ui.urls[4].url=/api/v1/payments/v3/api-docs

springdoc.swagger-ui.urls[5].name=Notification Service
springdoc.swagger-ui.urls[5].url=/api/v1/notifications/v3/api-docs