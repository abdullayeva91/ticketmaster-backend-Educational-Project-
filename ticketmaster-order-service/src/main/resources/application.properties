spring.application.name=ticketmaster-order-service
server.port=8086

# ?? BAZA AYARLARI (Docker üçün uy?unla?d?r?l?b)
# ?g?r SPRING_DATASOURCE_URL verilm?yibs?, avtomatik ticketmaster-postgres axtaracaq
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ticketmaster-postgres:5432/order_db}
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update

# ? EUREKA AYARLARI (Docker üçün uy?unla?d?r?l?b)
# ?g?r EUREKA_URL verilm?yibs?, avtomatik ticketmaster-eureka axtaracaq
eureka.client.service-url.defaultZone=${EUREKA_URL:http://ticketmaster-eureka:8761/eureka/}
eureka.instance.prefer-ip-address=true

# ? FEIGN CLIENT AYARLARI
feign.circuitbreaker.enabled=false
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=10000

# ? LOG AYARLARI
logging.level.com.ticketmaster.ticketmasterorderservice=DEBUG
logging.level.feign=DEBUG
logging.level.org.springframework.cloud.openfeign=DEBUG